name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint and check formatting
        run: npm run lint
      - name: Typecheck client and server
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build client and server
        run: npm run build
      - name: Smoke test the built server
        run: |
          npm start > /tmp/wingbeat-server.log 2>&1 &
          server_pid=$!
          if ! curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 \
            http://localhost:4173/api/health; then
            echo "Health check failed; server log:"
            cat /tmp/wingbeat-server.log
            exit 1
          fi
          kill "$server_pid" 2>/dev/null || true
